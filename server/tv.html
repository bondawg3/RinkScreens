<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/Nazareth_Ice_Oasis_Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<title>RinkScreens</title>
<style>
@font-face {
  font-family: 'DSEG14 Classic';
  src: url('/fonts/DSEG14Classic-Bold.woff2') format('woff2'),
       url('/fonts/DSEG14Classic-Bold.woff') format('woff');
  font-weight: bold;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'DS-Digital';
  src: url('/fonts/DS-Digital.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'DS-Digital';
  src: url('/fonts/DS-Digital-Bold.ttf') format('truetype');
  font-weight: bold;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'DSEG7 Classic';
  src: url('/fonts/DSEG7Classic-Bold.woff2') format('woff2'),
       url('/fonts/DSEG7Classic-Bold.woff') format('woff');
  font-weight: bold;
  font-style: normal;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #064878 0%, #0a84c8 60%, #1ab3e6 100%);
  color: #fff;
  height: 100vh;
  overflow: hidden;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
}

.bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 1;
}

header {
  position: relative;
  z-index: 2;
  background: #fff;
  padding: 12px 28px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: justify;
  -ms-flex-pack: justify;
  justify-content: space-between;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.rink-name {
  font-size: 2em;
  font-weight: bold;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #064878;
}

.rink-logo {
  max-height: 64px;
  max-width: 300px;
  object-fit: contain;
}

.date {
  font-size: 2.6em;
  font-weight: bold;
  color: #064878;
  position: absolute;
  left: 50%;
  -webkit-transform: translateX(-50%);
  transform: translateX(-50%);
}

.clock {
  font-size: 2.6em;
  font-weight: bold;
  color: #064878;
}

#content {
  position: relative;
  z-index: 2;
  -webkit-box-flex: 1;
  -ms-flex: 1;
  flex: 1;
  overflow: hidden;
  padding: 16px 40px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
}

/* ── Hockey ── */
.game-table { width: 100%; border-collapse: separate; border-spacing: 0px 20px; }

.game-table .col-header-row td {
  background: #62B0D0;
  color: #fff;
  padding: 14px 20px;
  font-size: 1em;
  font-weight: bold;
  letter-spacing: 0.08em;
}

.game-table .col-header-row td.col-transparent {
  background: transparent !important;
  padding: 0 !important;
}

.game-table .col-header-row td.col-cal-name {
  width: 1%;
  white-space: nowrap;
  border-radius: 8px;
  text-transform: none;
  letter-spacing: 0.03em;
}

.game-table tbody td {
  padding: 18px 20px;
  color: #064878;
  background: rgba(255,255,255,0.88);
}


.game-table tbody tr.game-row:nth-child(even) td {
  background: rgba(232,244,252,0.88);
}

.td-time  { font-weight: bold; white-space: nowrap; text-align: right; width: 1%; }
.td-title { font-weight: 600; color: #0a84c8; white-space: nowrap; }
.td-away  { font-weight: bold; text-align: left; white-space: nowrap; width: 15%; }
.td-home  { font-weight: bold; white-space: nowrap; width: 15%; }
.td-gap    { width: 20px; background: transparent !important; padding: 0 !important; }
.td-locker { font-weight: bold; text-align: center; background: #000 !important; color: #fff !important; white-space: nowrap; width: 70px; min-width: 70px; }

/* ── Rounded corners ── */
/* col-header row: Home/LR# and Away/LR# pills (7 cells: colspan-2 cal name + gap + home + lr + gap + away + lr) */
.game-table .col-header-row td:nth-child(3) { border-radius: 8px 0 0 8px; }
.game-table .col-header-row td:nth-child(4) { border-radius: 0 8px 8px 0; }
.game-table .col-header-row td:nth-child(6) { border-radius: 8px 0 0 8px; }
.game-table .col-header-row td:nth-child(7) { border-radius: 0 8px 8px 0; }
/* game rows */
.game-table tbody tr.game-row td:nth-child(1) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(2) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.game-row td:nth-child(4) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(5) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.game-row td:nth-child(7) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(8) { border-radius: 0 8px 8px 0; }

.game-table tbody tr.event-row td:nth-child(1) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.event-row td:nth-child(2) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.event-row:nth-child(even) td { background: rgba(235,245,255,0.88); }
.game-table tbody tr.event-row td { vertical-align: top; }
.game-table tbody tr.event-row td.td-time { padding: 0.4em 0.6em; }

/* ── Public Skate ── */
.skate-banner {
  background: #62B0D0;
  color: #fff;
  text-align: left;
  font-size: 2.2em;
  font-weight: bold;
  letter-spacing: 0.08em;
  padding: 14px 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.skate-wrap {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  gap: 24px;
  -webkit-box-flex: 1;
  -ms-flex: 1;
  flex: 1;
  min-height: 0;
}

.skate-sessions { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; border-radius: 6px; overflow: hidden; }
.skate-pricing  { width: 360px; border-radius: 6px; overflow: hidden; }

.section-title {
  background: rgba(6,72,120,0.85);
  color: #fff;
  padding: 8px 16px;
  font-size: 1.1em;
  font-weight: bold;
  letter-spacing: 0.08em;
  margin-bottom: 0;
  border-radius: 6px 6px 0 0;
}

/* Session header followed by a gapped (border-spacing) table rather than a
   flush list — round the bottom corners too since they're exposed to the
   background instead of butting against another rounded block. */
.section-title.section-title-gapped {
  border-radius: 6px;
}

.session-row {
  background: rgba(255,255,255,0.88);
  border-bottom: 2px solid rgba(10,132,200,0.15);
  padding: 12px 16px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  gap: 24px;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
}

.session-date { font-size: 1.2em; font-weight: bold; color: #064878; min-width: 240px; }
.session-time { font-size: 1.4em; font-weight: bold; color: #0a84c8; }

.price-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.price-table tr { border-bottom: 2px solid rgba(10,132,200,0.1); }
.price-table tr:last-child { border-bottom: none; }
.price-table tr:last-child .price-label  { border-radius: 0 0 0 6px; }
.price-table tr:last-child .price-amount { border-radius: 0 0 6px 0; }
.price-label  { padding: 12px 16px; font-size: 1.2em; font-weight: 600; color: #064878; background: rgba(255,255,255,0.88); }
.price-amount { padding: 12px 16px; font-size: 1.4em; font-weight: bold; color: #0a84c8; text-align: right; background: rgba(255,255,255,0.88); }
.price-subheading { margin-left: 0.75em; font-size: 0.8em; font-weight: 400; color: #4a7a9b; margin-top: 2px; }

/* ── Preview date bar ── */
#preview-bar {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  padding: 6px 12px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #fff;
  user-select: none;
}
#preview-bar button {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
#preview-bar button:hover { background: rgba(255,255,255,0.25); }
#preview-bar button.today-btn { font-weight: 700; }
#preview-date-input {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  padding: 3px 8px;
  cursor: pointer;
  outline: none;
  min-width: 130px;
  text-align: center;
}
#preview-date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
#pb-page-nav {
  display: none;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  padding-left: 12px;
  border-left: 1px solid rgba(255,255,255,0.25);
}
#pb-page-label { white-space: nowrap; min-width: 70px; text-align: center; }

/* ── Empty / Error ── */
.empty {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
  height: 100%;
  color: rgba(255,255,255,0.8);
}

.empty-icon { font-size: 5em; margin-bottom: 16px; }
.empty p { font-size: 1.8em; font-weight: bold; }
</style>

<body>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div id="preview-bar" style="display:none">
  <button id="pb-prev">&#8249;</button>
  <input type="date" id="preview-date-input" />
  <button id="pb-next">&#8250;</button>
  <button class="today-btn" id="pb-today">Today</button>
  <span id="pb-page-nav">
    <button id="pb-page-prev">&#8249;</button>
    <span id="pb-page-label"></span>
    <button id="pb-page-next">&#8250;</button>
  </span>
</div>
<header>
  <span class="rink-name" id="rink-name">Ice Rink</span>
  <span class="date" id="date"></span>
  <span class="clock" id="clock"></span>
</header>
<div id="content"></div>

<script>
// Exactly one of these is set: DISPLAY_ID on a physical TV (/tv/:displayId,
// content resolved through the display's schedule), SCREEN_ID on an admin
// preview of one screen config (/tv/screen/:screenId, no scheduling).
var DISPLAY_ID = '{{DISPLAY_ID}}';
var SCREEN_ID = '{{SCREEN_ID}}';
var pagedContentTimer = null; // games/figure-skating page rotation (shared, see renderPagedContent)
var reloadTimer = null;   // periodic full reload
var webpageTimer = null;  // webpage iframe refresh
var boundaryTimer = null; // one-shot re-fetch at the next schedule block boundary
// Shared state for multi-page content (games, figure skating). pageEndTimes[i]
// is the ms timestamp when page i's last event ends, used to time live
// rotation; in preview mode rotation is manual via the pb-page-nav controls.
var PAGED_STATE = { pageHtmls: null, pageEndTimes: null, bannerHtml: '', pageIdx: 0 };
var PREVIEW_DATE = (typeof URLSearchParams !== 'undefined')
  ? (new URLSearchParams(location.search).get('preview_date') || null)
  : null;

var DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getNow() {
  return PREVIEW_DATE ? new Date(PREVIEW_DATE + 'T00:00:00') : new Date();
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

function stepDate(dateStr, delta) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

// ── Preview bar ───────────────────────────────────────────────────────────────
var IS_PREVIEW = (typeof URLSearchParams !== 'undefined') && new URLSearchParams(location.search).has('preview');
if (IS_PREVIEW) {
  if (!PREVIEW_DATE) PREVIEW_DATE = todayStr();
  var bar = document.getElementById('preview-bar');
  var dateInput = document.getElementById('preview-date-input');
  bar.style.display = 'flex';
  dateInput.value = PREVIEW_DATE;

  function setPreviewDate(d) {
    PREVIEW_DATE = d;
    dateInput.value = d;
    loadScreen();
  }

  document.getElementById('pb-prev').onclick = function() { setPreviewDate(stepDate(PREVIEW_DATE, -1)); };
  document.getElementById('pb-next').onclick = function() { setPreviewDate(stepDate(PREVIEW_DATE, 1)); };
  document.getElementById('pb-today').onclick = function() { setPreviewDate(todayStr()); };
  dateInput.onchange = function() { if (dateInput.value) setPreviewDate(dateInput.value); };

  document.getElementById('pb-page-prev').onclick = function() {
    if (!PAGED_STATE.pageHtmls) return;
    var n = PAGED_STATE.pageHtmls.length;
    showPagedIndex((PAGED_STATE.pageIdx - 1 + n) % n);
  };
  document.getElementById('pb-page-next').onclick = function() {
    if (!PAGED_STATE.pageHtmls) return;
    var n = PAGED_STATE.pageHtmls.length;
    showPagedIndex((PAGED_STATE.pageIdx + 1) % n);
  };
}

// ── Filters ───────────────────────────────────────────────────────────────────
function filterByCalIds(items, calIds) {
  if (!calIds || !calIds.length) return items;
  return items.filter(function(x) { return calIds.indexOf(x.calendar_id) !== -1; });
}

// Items whose start_time falls on the current (or previewed) day
function filterToday(items) {
  var now = getNow();
  var dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dayEnd = new Date(dayStart.getTime() + 86400000);
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var t = new Date(items[i].start_time);
    if (t >= dayStart && t < dayEnd) out.push(items[i]);
  }
  return out;
}

function byStartTime(a, b) { return new Date(a.start_time) - new Date(b.start_time); }

// ── Paged content (games / figure skating) ──────────────────────────────────
// Renders one page and keeps PAGED_STATE in sync so the preview page-nav
// controls always reflect what's on screen.
function showPagedIndex(idx) {
  PAGED_STATE.pageIdx = idx;
  document.getElementById('content').innerHTML = PAGED_STATE.bannerHtml + PAGED_STATE.pageHtmls[idx];
  fitTable();
  updatePreviewPageControls();
}

function updatePreviewPageControls() {
  var wrap = document.getElementById('pb-page-nav');
  if (!wrap) return;
  var htmls = PAGED_STATE.pageHtmls;
  if (!IS_PREVIEW || !htmls || htmls.length <= 1) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'inline-flex';
  document.getElementById('pb-page-label').textContent = 'Page ' + (PAGED_STATE.pageIdx + 1) + ' / ' + htmls.length;
}

// In live mode, schedules the next page flip for whenever the current page's
// last event actually ends (falling back to rotateIntervalSec if unknown),
// with a small floor so back-to-back short pages don't flash by.
function scheduleNextPagedFlip(rotateIntervalSec) {
  var intervalMs = (rotateIntervalSec || 30) * 1000;
  var endTime = PAGED_STATE.pageEndTimes ? PAGED_STATE.pageEndTimes[PAGED_STATE.pageIdx] : 0;
  var waitMs = intervalMs;
  if (endTime) {
    waitMs = endTime - getNow().getTime();
    if (waitMs < 3000) waitMs = 3000;
  }
  pagedContentTimer = setTimeout(function() {
    var n = PAGED_STATE.pageHtmls.length;
    showPagedIndex((PAGED_STATE.pageIdx + 1) % n);
    scheduleNextPagedFlip(rotateIntervalSec);
  }, waitMs);
}

// pageEndTimes[i] is the ms timestamp when page i's last event ends (0/falsy
// if unknown). Live displays auto-rotate timed to those end times; in preview
// mode (where "now" is pinned to the previewed date and can't drive rotation)
// paging is manual via the pb-page-nav controls instead.
function renderPagedContent(bannerHtml, pageHtmls, pageEndTimes, rotateIntervalSec) {
  if (pagedContentTimer) { clearTimeout(pagedContentTimer); pagedContentTimer = null; }
  PAGED_STATE.bannerHtml = bannerHtml;
  PAGED_STATE.pageHtmls = pageHtmls;
  PAGED_STATE.pageEndTimes = pageEndTimes;
  showPagedIndex(0);

  if (pageHtmls.length > 1 && !IS_PREVIEW) {
    scheduleNextPagedFlip(rotateIntervalSec);
  }
}

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock').innerHTML = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  document.getElementById('date').innerHTML = DAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
}
setInterval(updateClock, 1000);
updateClock();

var annoClockTimer = null;
function updateAnnoDateTimes() {
  var els = document.getElementsByClassName('anno-datetime');
  if (!els.length) return;
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes(), sec = d.getSeconds();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  var timeBase = h + ':' + (m < 10 ? '0' : '') + m;
  var time = timeBase + ' ' + ampm;
  var timeWithSec = timeBase + ':' + (sec < 10 ? '0' : '') + sec + ' ' + ampm;
  var date = DAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
  for (var i = 0; i < els.length; i++) {
    var format = els[i].getAttribute('data-format');
    var t = els[i].getAttribute('data-seconds') === '1' ? timeWithSec : time;
    if (format === 'time') els[i].textContent = t;
    else if (format === 'date') els[i].textContent = date;
    else els[i].textContent = date + '\n' + t;
  }
}

// ── XHR helpers ────────────────────────────────────────────────────────────
function get(url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      try { cb(null, JSON.parse(xhr.responseText)); }
      catch(e) { cb(e); }
    }
  };
  xhr.send();
}

// Fetch several URLs in parallel; cb receives an array of results in the same
// order (null where a request failed)
function getAll(urls, cb) {
  var results = new Array(urls.length);
  var remaining = urls.length;
  for (var i = 0; i < urls.length; i++) (function(idx) {
    get(urls[idx], function(err, data) {
      results[idx] = err ? null : data;
      remaining--;
      if (remaining === 0) cb(results);
    });
  })(i);
}

// Prices for a screen with show_pricing, filtered to its selected pricing_ids;
// null when the screen doesn't show pricing
function loadPricesFor(screen, cb) {
  if (!screen.show_pricing) { cb(null); return; }
  get('/api/skate-prices', function(err, prices) {
    var selectedIds = screen.pricing_ids || [];
    cb((prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; }));
  });
}

// ── Format helpers ─────────────────────────────────────────────────────────
// Escape data before inserting into innerHTML — titles and team names come
// from external calendar feeds and must never be treated as markup
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(iso) {
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

function fmtDate(iso) {
  var d = new Date(iso);
  return DAY_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
}

// ── Lookup maps ────────────────────────────────────────────────────────────
function buildCalMap(calendars) {
  var map = {};
  if (calendars) {
    for (var i = 0; i < calendars.length; i++) {
      map[String(calendars[i].id)] = calendars[i].name;
    }
  }
  return map;
}

function buildTeamMap(leagues) {
  var map = {};
  if (leagues) {
    for (var i = 0; i < leagues.length; i++) {
      var teams = leagues[i].teams || [];
      for (var j = 0; j < teams.length; j++) {
        var t = teams[j];
        map[t.name.toLowerCase()] = {
          label: t.display_name || t.name,
          color: t.color || '',
          textColor: t.text_color || '',
        };
      }
    }
  }
  return map;
}

function teamInfo(teamMap, name) {
  return name
    ? (teamMap[name.toLowerCase()] || { label: name, color: '', textColor: '' })
    : { label: 'Open', color: '', textColor: '' };
}

// ── Shared row / block builders ─────────────────────────────────────────────
function teamStyleAttr(info) {
  var s = info.color ? 'background:' + info.color + ';' + (info.textColor ? 'color:' + info.textColor + ';' : '') : '';
  return s ? ' style="' + esc(s) + '"' : '';
}

// Full game row with team colors and locker room numbers (titleHtml is
// pre-escaped: the event title on game boards, the calendar name on custom)
function buildLockerGameRow(timeStr, titleHtml, homeInfo, awayInfo, homeLocker, awayLocker) {
  return '<tr class="game-row">' +
    '<td class="td-time">' + timeStr + '</td>' +
    '<td class="td-title">' + titleHtml + '</td>' +
    '<td class="td-gap"></td>' +
    '<td class="td-home"' + teamStyleAttr(homeInfo) + '>' + esc(homeInfo.label) + '</td>' +
    '<td class="td-locker">' + esc(homeLocker || '') + '</td>' +
    '<td class="td-gap"></td>' +
    '<td class="td-away"' + teamStyleAttr(awayInfo) + '>' + esc(awayInfo.label) + '</td>' +
    '<td class="td-locker">' + esc(awayLocker || '') + '</td>' +
    '</tr>';
}

// Simple time + description row (contentHtml is pre-escaped)
function buildEventRow(timeStr, contentHtml) {
  return '<tr class="event-row">' +
    '<td class="td-time">' + timeStr + '</td>' +
    '<td style="padding:0.4em 0.6em;font-size:1em;">' + contentHtml + '</td>' +
    '</tr>';
}

function buildPriceTable(prices) {
  if (!prices || !prices.length) {
    return '<div style="padding:16px;color:rgba(255,255,255,0.7)">Pricing not configured</div>';
  }
  var html = '';
  for (var j = 0; j < prices.length; j++) {
    var labelCell = esc(prices[j].label);
    if (prices[j].subheading) {
      labelCell += '<div class="price-subheading">' + esc(prices[j].subheading) + '</div>';
    }
    html += '<tr><td class="price-label">' + labelCell + '</td><td class="price-amount">' + esc(prices[j].price) + '</td></tr>';
  }
  return '<table class="price-table">' + html + '</table>';
}

function wrapWithPricing(pageHtml, prices) {
  if (!prices) return pageHtml;
  return '<div class="skate-wrap">' +
    '<div class="skate-sessions">' + pageHtml + '</div>' +
    '<div class="skate-pricing"><div class="section-title">Admission</div>' + buildPriceTable(prices) + '</div>' +
    '</div>';
}

// ── Render ─────────────────────────────────────────────────────────────────
// Builds the tbody rows for one page's worth of games, grouped by calendar
// under a header row. Callers pass chronologically sorted slices; a new block
// (with a repeated header) starts whenever the calendar changes from the
// previous event, so interleaved events (Team A, Team B, Team A) stay in true
// time order instead of being merged into one out-of-order block per team.
function buildGamesRows(pageGames, calMap, teamMap, showLockerRooms) {
  var blocks = [];
  for (var i = 0; i < pageGames.length; i++) {
    var key = pageGames[i].calendar_id ? String(pageGames[i].calendar_id) : '__none__';
    var prev = blocks.length ? blocks[blocks.length - 1] : null;
    if (prev && prev.key === key) {
      prev.games.push(pageGames[i]);
    } else {
      blocks.push({ key: key, games: [pageGames[i]] });
    }
  }

  var tbody = '';
  for (var bi = 0; bi < blocks.length; bi++) {
    var key = blocks[bi].key;
    var calName = calMap && calMap[key] ? calMap[key] : '';
    if (showLockerRooms) {
      tbody +=
        '<tr class="col-header-row">' +
          '<td class="col-cal-name" colspan="2">' + esc(calName) + '</td>' +
          '<td class="col-transparent td-gap"></td>' +
          '<td style="white-space:nowrap">Home</td>' +
          '<td style="width:70px;min-width:70px;text-align:center">LR#</td>' +
          '<td class="col-transparent td-gap"></td>' +
          '<td style="white-space:nowrap">Away</td>' +
          '<td style="width:70px;min-width:70px;text-align:center">LR#</td>' +
        '</tr>';
    } else {
      tbody += '<tr class="col-header-row"><td class="col-cal-name" colspan="2">' + esc(calName) + '</td></tr>';
    }
    var grpGames = blocks[bi].games;
    for (var j = 0; j < grpGames.length; j++) {
      var g = grpGames[j];
      var homeInfo = teamInfo(teamMap, g.home_team);
      var awayInfo = teamInfo(teamMap, g.away_team);
      if (showLockerRooms) {
        tbody += buildLockerGameRow(fmtTime(g.start_time), esc(g.title || ''), homeInfo, awayInfo, g.home_locker, g.away_locker);
      } else {
        var matchup = esc(homeInfo.label) + ' vs ' + esc(awayInfo.label);
        var mergedTitle = g.title ? esc(g.title) + ' — ' + matchup : matchup;
        tbody += buildEventRow(fmtTime(g.start_time), mergedTitle);
      }
    }
    if (bi < blocks.length - 1) {
      tbody += '<tr style="height:0.6em"><td colspan="8" style="padding:0;border:none;background:transparent"></td></tr>';
    }
  }
  return tbody;
}

// Games/practices/stick-&-shoot etc. for the day, grouped by calendar. Split
// into pages at any natural gap in the schedule (e.g. an afternoon public
// skate), falling back to a fixed chunk size when a page is still too big —
// and those pages rotate automatically, timed to when each page's games end.
var GAMES_PER_PAGE = 6;
var GAMES_GAP_SPLIT_MS = 60 * 60 * 1000; // 60 minutes

function splitGamesIntoPages(games) {
  var splitIdxs = [];
  for (var i = 0; i < games.length - 1; i++) {
    var endCur = new Date(games[i].end_time || games[i].start_time).getTime();
    var startNext = new Date(games[i + 1].start_time).getTime();
    if (startNext - endCur >= GAMES_GAP_SPLIT_MS) splitIdxs.push(i + 1);
  }

  var pages = [];
  if (splitIdxs.length) {
    var start = 0;
    for (var s = 0; s < splitIdxs.length; s++) {
      pages.push(games.slice(start, splitIdxs[s]));
      start = splitIdxs[s];
    }
    pages.push(games.slice(start));
  } else {
    pages = [games];
  }

  // Two (or more) consecutive small pages (<=2 games each) get merged into one
  // page rather than each flashing by on its own screen.
  var mergedPages = [];
  for (var m = 0; m < pages.length; m++) {
    var last = mergedPages.length ? mergedPages[mergedPages.length - 1] : null;
    if (last && last.length <= 2 && pages[m].length <= 2) {
      mergedPages[mergedPages.length - 1] = last.concat(pages[m]);
    } else {
      mergedPages.push(pages[m]);
    }
  }

  // A page can still come out much bigger than GAMES_PER_PAGE (or no gap
  // existed at all) — further split any oversized page by fixed count.
  var finalPages = [];
  for (var p = 0; p < mergedPages.length; p++) {
    if (mergedPages[p].length > GAMES_PER_PAGE) {
      for (var j = 0; j < mergedPages[p].length; j += GAMES_PER_PAGE) {
        finalPages.push(mergedPages[p].slice(j, j + GAMES_PER_PAGE));
      }
    } else {
      finalPages.push(mergedPages[p]);
    }
  }
  return finalPages;
}

function renderGames(screen, games, calMap, teamMap, prices, showLockerRooms) {
  teamMap = teamMap || {};
  games = (games || []).slice().sort(byStartTime);
  var bannerHtml = (prices && screen.name) ? '<div class="skate-banner">' + esc(screen.name) + '</div>' : '';
  var header = prices ? '<div class="section-title section-title-gapped">Today\'s Games</div>' : '';
  var content = document.getElementById('content');

  if (games.length === 0) {
    if (pagedContentTimer) { clearTimeout(pagedContentTimer); pagedContentTimer = null; }
    PAGED_STATE.pageHtmls = null;
    updatePreviewPageControls();
    content.innerHTML = bannerHtml +
      wrapWithPricing(header + '<div class="empty"><div class="empty-icon">&#127944;</div><p>No games scheduled for today</p></div>', prices);
    return;
  }

  function pageHtml(pageGames) {
    return wrapWithPricing(header + '<table class="game-table"><tbody>' +
      buildGamesRows(pageGames, calMap, teamMap, showLockerRooms) + '</tbody></table>', prices);
  }

  var pages = splitGamesIntoPages(games);
  var pageHtmls = pages.map(pageHtml);
  var pageEndTimes = pages.map(function(pageGames) {
    var maxEnd = 0;
    for (var i = 0; i < pageGames.length; i++) {
      var e = new Date(pageGames[i].end_time || pageGames[i].start_time).getTime();
      if (e > maxEnd) maxEnd = e;
    }
    return maxEnd;
  });

  renderPagedContent(bannerHtml, pageHtmls, pageEndTimes, screen.rotate_interval);
}

function renderSkate(sessions, prices, heading) {
  var sessionHtml = '';
  if (!sessions || sessions.length === 0) {
    sessionHtml = '<div style="padding:16px;color:rgba(255,255,255,0.7)">No upcoming sessions</div>';
  } else {
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      sessionHtml += '<div class="session-row">' +
        '<span class="session-date">' + fmtDate(s.start_time) + '</span>' +
        '<span class="session-time">' + fmtTime(s.start_time) + ' &ndash; ' + fmtTime(s.end_time) + '</span>' +
        '</div>';
    }
  }

  var sessionsBlock = '<div class="section-title">Upcoming Sessions</div>' + sessionHtml;

  document.getElementById('content').innerHTML =
    (heading ? '<div class="skate-banner">' + esc(heading) + '</div>' : '') +
    wrapWithPricing(sessionsBlock, prices);
}

function renderFigureSkating(screen, events, prices) {
  var oMode = screen.overflow_mode || 'none';
  var twoCol = !!screen.two_column;
  var maxPerPage = twoCol ? 12 : 24; // rows per column; 2-col = 24 events/page

  // Filter to today (or from now for flow mode)
  var filtered2 = filterByCalIds(events, screen.calendar_ids);
  var todayEvents;
  if (oMode === 'flow' && !PREVIEW_DATE) {
    clearInterval(reloadTimer);
    reloadTimer = setInterval(loadScreen, 300000);
    var realNow = new Date();
    var flowDayEnd = new Date(realNow.getFullYear(), realNow.getMonth(), realNow.getDate() + 1);
    todayEvents = [];
    for (var i = 0; i < filtered2.length; i++) {
      var st = new Date(filtered2[i].start_time);
      if (st >= realNow && st < flowDayEnd) todayEvents.push(filtered2[i]);
    }
  } else {
    todayEvents = filterToday(filtered2);
  }
  todayEvents.sort(byStartTime);

  // Consolidate rows: group events sharing the same start minute, show time once
  var rows = [];
  var timeMap = {};
  for (var i = 0; i < todayEvents.length; i++) {
    var ev = todayEvents[i];
    var d = new Date(ev.start_time);
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '-' + d.getHours() + '-' + d.getMinutes();
    if (!timeMap[key]) {
      timeMap[key] = { timeStr: fmtTime(ev.start_time), titles: [], endTime: 0 };
      rows.push(timeMap[key]);
    }
    timeMap[key].titles.push(ev.raw_title || ev.title || '');
    var evEnd = new Date(ev.end_time || ev.start_time).getTime();
    if (evEnd > timeMap[key].endTime) timeMap[key].endTime = evEnd;
  }
  function titlesCell(titles) {
    return titles.map(function(t) { return esc(t); }).join('<br>');
  }

  function buildColTable(colRows) {
    if (!colRows.length) return '';
    var t = '<table class="game-table"><tbody>';
    for (var i = 0; i < colRows.length; i++) {
      t += buildEventRow(colRows[i].timeStr, titlesCell(colRows[i].titles));
    }
    t += '</tbody></table>';
    return t;
  }

  function buildPage(pageRows) {
    var header = '<div class="section-title section-title-gapped">Upcoming Sessions</div>';
    if (!pageRows.length) return header + '<div class="empty"><p>No events scheduled.</p></div>';
    if (!twoCol) {
      return header + buildColTable(pageRows);
    } else {
      var half = Math.ceil(pageRows.length / 2);
      var col1 = pageRows.slice(0, half);
      var col2 = pageRows.slice(half);
      return header + '<div style="display:flex;gap:24px;height:100%">' +
        '<div style="flex:1;overflow:hidden">' + buildColTable(col1) + '</div>' +
        '<div style="flex:1;overflow:hidden">' + buildColTable(col2) + '</div>' +
        '</div>';
    }
  }

  var bannerHtml = screen.name ? '<div class="skate-banner">' + esc(screen.name) + '</div>' : '';

  if (oMode === 'rotate' && rows.length > maxPerPage) {
    // Split into pages, rotate timed to when each page's sessions end (live)
    // or manually via the preview page-nav controls (preview).
    var pages = [];
    for (var i = 0; i < rows.length; i += maxPerPage) {
      pages.push(rows.slice(i, i + maxPerPage));
    }
    var pageHtmls = [];
    var pageEndTimes = [];
    for (var i = 0; i < pages.length; i++) {
      pageHtmls.push(wrapWithPricing(buildPage(pages[i]), prices));
      var maxEnd = 0;
      for (var r = 0; r < pages[i].length; r++) {
        if (pages[i][r].endTime > maxEnd) maxEnd = pages[i][r].endTime;
      }
      pageEndTimes.push(maxEnd);
    }
    renderPagedContent(bannerHtml, pageHtmls, pageEndTimes, screen.rotate_interval);
  } else {
    // No rotation — show first maxPerPage rows
    var singleHtml = rows.length
      ? wrapWithPricing(buildPage(rows.slice(0, maxPerPage)), prices)
      : wrapWithPricing('<div class="empty"><p>No events scheduled for today.</p></div>', prices);
    renderPagedContent(bannerHtml, [singleHtml], [0], screen.rotate_interval);
  }
}

// ── Auto-fit table font size ──────────────────────────────────────────────
function fitTable() {
  var content = document.getElementById('content');
  var tables = content ? content.querySelectorAll('.game-table') : null;
  if (!tables || !tables.length) return;
  function setSize(size) {
    for (var i = 0; i < tables.length; i++) tables[i].style.fontSize = size + 'em';
  }
  // A table with width:100% never reports scrollWidth > clientWidth even when
  // a nowrap cell (e.g. a long game title) needs more room than its column has
  // — table auto-layout just steals space from the .td-gap spacer columns
  // (their specified 20px width, matching the row-to-row gap from
  // border-spacing, is only a hint and not guaranteed) instead of the table
  // ever truly overflowing. So instead of measuring the table as a whole,
  // check directly whether any gap column has been squeezed below that
  // intended 20px — that's the visible symptom we actually care about.
  function overflowing() {
    var minGap = 20 * 0.9; // small tolerance for rounding
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      if (t.scrollHeight > content.clientHeight) return true;
      var gaps = t.querySelectorAll('.td-gap');
      for (var g = 0; g < gaps.length; g++) {
        if (gaps[g].offsetWidth < minGap) return true;
      }
    }
    return false;
  }
  var size = 3.5;
  setSize(size);
  while (overflowing() && size > 0.5) {
    size = Math.round((size - 0.05) * 100) / 100;
    setSize(size);
  }
}

// ── Load data ──────────────────────────────────────────────────────────────
function loadScreen() {
  // Stop timers from the previous render — a screen switched away from
  // games/figure-skating rotation or a webpage must not keep its old timer firing
  if (pagedContentTimer) { clearTimeout(pagedContentTimer); pagedContentTimer = null; }
  PAGED_STATE.pageHtmls = null;
  updatePreviewPageControls();
  if (webpageTimer) { clearTimeout(webpageTimer); webpageTimer = null; }
  if (boundaryTimer) { clearTimeout(boundaryTimer); boundaryTimer = null; }
  if (annoClockTimer) { clearInterval(annoClockTimer); annoClockTimer = null; }
  if (reloadTimer) { clearInterval(reloadTimer); }
  reloadTimer = setInterval(loadScreen, 60000);

  if (DISPLAY_ID) {
    // Physical display: the server resolves the schedule to one screen config
    get('/api/displays/' + DISPLAY_ID + '/active', function(err, data) {
      if (err || !data) return;
      // Re-fetch exactly when the current block ends / the next one starts,
      // so scheduled switches don't wait for the 60s poll
      if (data.valid_until) {
        var waitMs = new Date(data.valid_until).getTime() - Date.now();
        if (waitMs > 0) boundaryTimer = setTimeout(loadScreen, Math.max(waitMs, 1000) + 500);
      }
      if (!data.screen) {
        document.getElementById('content').innerHTML =
          '<div class="empty"><p>No screen assigned to this display.</p></div>';
        return;
      }
      renderScreenConfig(data.screen);
    });
  } else {
    get('/api/screens', function(err, screens) {
      if (err || !screens) return;
      var screen = null;
      for (var i = 0; i < screens.length; i++) {
        if (String(screens[i].id) === String(SCREEN_ID)) { screen = screens[i]; break; }
      }
      if (!screen) return;
      renderScreenConfig(screen);
    });
  }
}

function renderScreenConfig(screen) {
    // Background
    var bgEl = document.getElementById('bg');
    if (screen.bg_color) bgEl.style.backgroundColor = screen.bg_color;
    if (screen.bg_filename) {
      bgEl.style.backgroundImage = 'url(/uploads/' + screen.bg_filename + ')';
    }
    bgEl.style.opacity = (screen.bg_opacity != null ? screen.bg_opacity : 100) / 100;

    // Undo the announcement layout overrides in case the type changed
    var contentEl = document.getElementById('content');
    contentEl.style.padding = '';

    var dtype = screen.display_type;

    if (dtype === 'games') {
      getAll(['/api/games', '/api/calendars', '/api/leagues'], function(results) {
        var games = results[0];
        if (!games) return;
        var filtered = filterToday(games.filter(function(g) { return !g.is_skate; }));
        filtered = filterByCalIds(filtered, screen.calendar_ids);
        var calMap = buildCalMap(results[1]);
        var teamMap = buildTeamMap(results[2]);
        var showLockerRooms = screen.show_locker_rooms !== false;
        loadPricesFor(screen, function(prices) {
          renderGames(screen, filtered, calMap, teamMap, prices, showLockerRooms);
        });
      });

    } else if (dtype === 'skate') {
      // Sessions come from the skate-sessions endpoint (Public Skates calendars),
      // narrowed to this screen's selected calendars. ?from= keeps the preview
      // date bar working and keeps in-progress sessions visible until they end.
      var skateNow = getNow();
      get('/api/skate-sessions?from=' + encodeURIComponent(skateNow.toISOString()), function(err2, sessions) {
        loadPricesFor(screen, function(prices) {
          var daysAhead = screen.days_ahead != null ? screen.days_ahead : 14;
          var cutoff = new Date(skateNow.getTime() + daysAhead * 86400000);
          var list = [];
          if (sessions) {
            for (var i = 0; i < sessions.length; i++) {
              var st = new Date(sessions[i].start_time);
              if (st < cutoff) list.push(sessions[i]);
            }
          }
          list = filterByCalIds(list, screen.calendar_ids);
          renderSkate(list, prices, screen.name);
        });
      });

    } else if (dtype === 'webpage') {
      if (screen.webpage_url) {
        var wpWidth = screen.webpage_width || 100;
        var wpZoom = (screen.webpage_zoom || 100) / 100;
        var wpRefresh = screen.webpage_refresh || 0;
        var iframeId = 'webpage-frame';
        document.getElementById('content').innerHTML =
          '<div style="width:100%;height:100%;display:flex;justify-content:center;overflow:hidden;">' +
          '<iframe id="' + iframeId + '" src="' + esc(screen.webpage_url) + '" style="width:' + wpWidth + '%;height:' + Math.round(100 / wpZoom) + '%;border:none;flex-shrink:0;transform:scale(' + wpZoom + ');transform-origin:top center;" allowfullscreen></iframe>' +
          '</div>';
        if (wpRefresh > 0) {
          webpageTimer = setTimeout(function reloadFrame() {
            var f = document.getElementById(iframeId);
            if (f) f.src = f.src;
            webpageTimer = setTimeout(reloadFrame, wpRefresh * 60000);
          }, wpRefresh * 60000);
        }
      } else {
        document.getElementById('content').innerHTML =
          '<div class="empty"><p>No webpage URL configured.</p></div>';
      }

    } else if (dtype === 'rink_events') {
      get('/api/rink-events', function(err2, events) {
        if (err2 || !events) return;
        var todayEvents = filterToday(filterByCalIds(events, screen.calendar_ids));
        todayEvents.sort(byStartTime);
        loadPricesFor(screen, function(prices) {
          var scheduleHeader = prices ? '<div class="section-title section-title-gapped">Schedule</div>' : '';
          var html;
          if (todayEvents.length === 0) {
            html = scheduleHeader + '<div class="empty"><p>No events scheduled for today.</p></div>';
          } else {
            var tbody = '';
            if (!prices) {
              tbody += '<tr class="col-header-row"><td class="col-cal-name" colspan="2">Rink Events</td></tr>';
            }
            for (var i = 0; i < todayEvents.length; i++) {
              var ev = todayEvents[i];
              tbody += buildEventRow(fmtTime(ev.start_time), esc(ev.raw_title || ev.title || ''));
            }
            html = scheduleHeader + '<table class="game-table"><tbody>' + tbody + '</tbody></table>';
          }
          var bannerHtml = (prices && screen.name) ? '<div class="skate-banner">' + esc(screen.name) + '</div>' : '';
          document.getElementById('content').innerHTML = bannerHtml + wrapWithPricing(html, prices);
          fitTable();
        });
      });

    } else if (dtype === 'figure_skating') {
      get('/api/figure-skating', function(err2, events) {
        if (err2 || !events) return;
        loadPricesFor(screen, function(prices) {
          renderFigureSkating(screen, events, prices);
        });
      });

    } else if (dtype === 'custom') {
      var customNow = getNow();
      var dayStartIso = new Date(customNow.getFullYear(), customNow.getMonth(), customNow.getDate()).toISOString();
      getAll([
        '/api/games',
        '/api/rink-events',
        '/api/figure-skating',
        '/api/skate-sessions?from=' + encodeURIComponent(dayStartIso),
        '/api/calendars',
        '/api/leagues',
      ], function(results) {
        var games = results[0], rinkEvents = results[1], figEvents = results[2], skateSessions = results[3];
        var calMap = buildCalMap(results[4]);
        var teamMap = buildTeamMap(results[5]);

        function todayScoped(list) {
          return list ? filterToday(filterByCalIds(list, screen.calendar_ids)) : [];
        }

        var items = [];
        var i, ev;
        var fg = todayScoped(games);
        for (i = 0; i < fg.length; i++) {
          var g = fg[i];
          items.push({ start_time: g.start_time, kind: g.is_skate ? 'skate' : 'game',
            title: g.is_skate ? ('Public Skate: ' + fmtTime(g.start_time) + ' – ' + fmtTime(g.end_time)) : (g.title || ''),
            calendar_id: g.calendar_id,
            home_team: g.home_team, away_team: g.away_team,
            home_locker: g.home_locker, away_locker: g.away_locker });
        }
        var fr = todayScoped(rinkEvents);
        for (i = 0; i < fr.length; i++) {
          ev = fr[i];
          items.push({ start_time: ev.start_time, kind: 'event',
            title: ev.raw_title || ev.title || '', calendar_id: ev.calendar_id });
        }
        var ff = todayScoped(figEvents);
        for (i = 0; i < ff.length; i++) {
          ev = ff[i];
          items.push({ start_time: ev.start_time, kind: 'figure',
            title: ev.raw_title || ev.title || '', calendar_id: ev.calendar_id });
        }
        var fs = todayScoped(skateSessions);
        for (i = 0; i < fs.length; i++) {
          ev = fs[i];
          items.push({ start_time: ev.start_time, kind: 'event',
            title: 'Public Skate: ' + fmtTime(ev.start_time) + ' – ' + fmtTime(ev.end_time), calendar_id: ev.calendar_id });
        }

        items.sort(byStartTime);

        loadPricesFor(screen, function(prices) {
          var bannerHtml = screen.name ? '<div class="skate-banner">' + esc(screen.name) + '</div>' : '';
          var header = '<div class="section-title section-title-gapped">Events</div>';

          var customHtml;
          if (items.length === 0) {
            customHtml = '<div class="empty"><div class="empty-icon">&#128197;</div><p>No events scheduled for today</p></div>';
          } else {
            var showLockerRooms = screen.show_locker_rooms !== false;
            var tbody = '';
            for (var k = 0; k < items.length; k++) {
              var it = items[k];
              var timeStr = fmtTime(it.start_time);
              if (it.kind === 'game' && showLockerRooms) {
                var calName = calMap[String(it.calendar_id)] || '';
                tbody += buildLockerGameRow(timeStr, esc(calName),
                  teamInfo(teamMap, it.home_team), teamInfo(teamMap, it.away_team),
                  it.home_locker, it.away_locker);
              } else if (it.kind === 'game') {
                var matchup = esc(teamInfo(teamMap, it.home_team).label) + ' vs ' + esc(teamInfo(teamMap, it.away_team).label);
                tbody += buildEventRow(timeStr, matchup);
              } else {
                tbody += buildEventRow(timeStr, esc(it.title));
              }
            }
            customHtml = '<table class="game-table"><tbody>' + tbody + '</tbody></table>';
          }

          document.getElementById('content').innerHTML = bannerHtml + wrapWithPricing(header + customHtml, prices);
          fitTable();
        });
      });

    } else if (dtype === 'message') {
      document.getElementById('content').innerHTML =
        '<div class="empty"><p>' + esc(screen.custom_message || 'Welcome!') + '</p></div>';

    } else if (dtype === 'announcement') {
      var annoData = screen.announcement_data;
      var content = document.getElementById('content');
      content.style.position = 'relative';
      content.style.padding = '0';
      if (!annoData || !annoData.elements || !annoData.elements.length) {
        content.innerHTML = '<div class="empty"><p>No announcement content.</p></div>';
        return;
      }
      var annoHtml = '';
      for (var ai = 0; ai < annoData.elements.length; ai++) {
        var ae = annoData.elements[ai];
        if (ae.type === 'text') {
          annoHtml += '<div style="' +
            'position:absolute;left:' + Number(ae.x) + '%;top:' + Number(ae.y) + '%;' +
            'transform:translate(-50%,-50%);' +
            'width:max-content;' +
            'color:' + esc(ae.color || '#fff') + ';' +
            'font-family:' + esc(ae.font || 'Arial') + ',sans-serif;' +
            'font-size:' + ((ae.size || 48) / 19.2).toFixed(3) + 'vw;' +
            'font-weight:' + (ae.bold ? 'bold' : 'normal') + ';' +
            'text-align:' + esc(ae.align || 'left') + ';' +
            'white-space:pre;line-height:1.2;pointer-events:none;' +
            '">' + esc(ae.text || '') + '</div>';
        } else if (ae.type === 'image') {
          annoHtml += '<img src="/uploads/' + esc(ae.filename) + '" style="' +
            'position:absolute;left:' + Number(ae.x) + '%;top:' + Number(ae.y) + '%;' +
            'width:' + (Number(ae.width) || 25) + '%;' +
            'transform:translate(-50%,-50%);pointer-events:none;" alt="" />';
        } else if (ae.type === 'datetime') {
          annoHtml += '<div class="anno-datetime" data-format="' + esc(ae.format || 'datetime') + '" data-seconds="' + (ae.showSeconds ? '1' : '0') + '" style="' +
            'position:absolute;left:' + Number(ae.x) + '%;top:' + Number(ae.y) + '%;' +
            'transform:translate(-50%,-50%);' +
            'width:max-content;' +
            'color:' + esc(ae.color || '#fff') + ';' +
            'font-family:' + esc(ae.font || 'Arial') + ',sans-serif;' +
            'font-size:' + ((ae.size || 48) / 19.2).toFixed(3) + 'vw;' +
            'font-weight:' + (ae.bold ? 'bold' : 'normal') + ';' +
            'text-align:' + esc(ae.align || 'left') + ';' +
            'white-space:pre;line-height:1.2;pointer-events:none;' +
            '"></div>';
        }
      }
      content.innerHTML = annoHtml;
      updateAnnoDateTimes();
      if (annoClockTimer) clearInterval(annoClockTimer);
      annoClockTimer = setInterval(updateAnnoDateTimes, 1000);
    }
}

// ── Settings (rink name / logo) ───────────────────────────────────────────────
get('/api/settings', function(err, s) {
  if (err || !s) return;
  var el = document.getElementById('rink-name');
  if (s.logo_filename) {
    el.innerHTML = '<img class="rink-logo" src="/uploads/' + esc(s.logo_filename) + '" alt="' + esc(s.rink_name || 'Rink') + '">';
  } else if (s.rink_name) {
    el.innerHTML = esc(s.rink_name);
  }
});

// ── WebSocket (best-effort) ────────────────────────────────────────────────
function connectWS() {
  try {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + location.host +
      (DISPLAY_ID ? '?displayId=' + DISPLAY_ID : '?screenId=' + SCREEN_ID));
    ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'ping') ws.send('{"type":"pong"}');
        if (msg.type === 'reload' || msg.type === 'refresh_data') loadScreen();
      } catch(x) {}
    };
    ws.onclose = function() { setTimeout(connectWS, 3000); };
  } catch(x) {}
}
connectWS();

// ── Auto-refresh fallback (interval managed dynamically inside loadScreen) ─

// ── Initial load ───────────────────────────────────────────────────────────
loadScreen();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/Nazareth_Ice_Oasis_Icon.png">
<title>RinkScreens</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #064878 0%, #0a84c8 60%, #1ab3e6 100%);
  color: #fff;
  height: 100vh;
  overflow: hidden;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
}

.bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 1;
}

header {
  position: relative;
  z-index: 2;
  background: #fff;
  padding: 12px 28px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: justify;
  -ms-flex-pack: justify;
  justify-content: space-between;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.rink-name {
  font-size: 2em;
  font-weight: bold;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #064878;
}

.rink-logo {
  max-height: 64px;
  max-width: 300px;
  object-fit: contain;
}

.date {
  font-size: 2em;
  font-weight: bold;
  color: #064878;
  position: absolute;
  left: 50%;
  -webkit-transform: translateX(-50%);
  transform: translateX(-50%);
}

.clock {
  font-size: 2em;
  font-weight: bold;
  color: #064878;
}

#content {
  position: relative;
  z-index: 2;
  -webkit-box-flex: 1;
  -ms-flex: 1;
  flex: 1;
  overflow: hidden;
  padding: 16px 40px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
}

/* ── Game Board ── */
.game-table { width: 100%; border-collapse: separate; border-spacing: 0px 20px; }

.game-table .col-header-row td {
  background: #62B0D0;
  color: #fff;
  padding: 14px 20px;
  font-size: 1em;
  font-weight: bold;
  letter-spacing: 0.08em;
}

.game-table .col-header-row td.col-transparent {
  background: transparent !important;
  padding: 0 !important;
}

.game-table .col-header-row td.col-cal-name {
  width: 1%;
  white-space: nowrap;
  border-radius: 8px;
  text-transform: none;
  letter-spacing: 0.03em;
}

.game-table tbody td {
  padding: 18px 20px;
  color: #064878;
  background: rgba(255,255,255,0.88);
}


.game-table tbody tr.game-row:nth-child(even) td {
  background: rgba(232,244,252,0.88);
}

.td-time  { font-weight: bold; white-space: nowrap; text-align: right; width: 1%; }
.td-title { font-weight: 600; color: #0a84c8; white-space: nowrap; }
.td-away  { font-weight: bold; text-align: left; white-space: nowrap; width: 15%; }
.td-home  { font-weight: bold; white-space: nowrap; width: 15%; }
.td-gap    { width: 20px; background: transparent !important; padding: 0 !important; }
.td-locker { font-weight: bold; text-align: center; background: #000 !important; color: #fff !important; white-space: nowrap; width: 70px; min-width: 70px; }

/* ── Rounded corners ── */
/* col-header row: Home/LR# and Away/LR# pills (7 cells: colspan-2 cal name + gap + home + lr + gap + away + lr) */
.game-table .col-header-row td:nth-child(3) { border-radius: 8px 0 0 8px; }
.game-table .col-header-row td:nth-child(4) { border-radius: 0 8px 8px 0; }
.game-table .col-header-row td:nth-child(6) { border-radius: 8px 0 0 8px; }
.game-table .col-header-row td:nth-child(7) { border-radius: 0 8px 8px 0; }
/* game rows */
.game-table tbody tr.game-row td:nth-child(1) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(2) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.game-row td:nth-child(4) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(5) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.game-row td:nth-child(7) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.game-row td:nth-child(8) { border-radius: 0 8px 8px 0; }

.game-table tbody tr.event-row td:nth-child(1) { border-radius: 8px 0 0 8px; }
.game-table tbody tr.event-row td:nth-child(2) { border-radius: 0 8px 8px 0; }
.game-table tbody tr.event-row:nth-child(even) td { background: rgba(235,245,255,0.88); }
.game-table tbody tr.event-row td { vertical-align: top; }
.game-table tbody tr.event-row td.td-time { padding: 0.4em 0.6em; }

/* ── Public Skate ── */
.skate-banner {
  background: rgba(6,72,120,0.85);
  color: #fff;
  text-align: left;
  font-size: 2.2em;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 14px 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.skate-wrap {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  gap: 24px;
  -webkit-box-flex: 1;
  -ms-flex: 1;
  flex: 1;
  min-height: 0;
}

.skate-sessions { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; border-radius: 6px; overflow: hidden; }
.skate-pricing  { width: 360px; border-radius: 6px; overflow: hidden; }

.section-title {
  background: rgba(6,72,120,0.85);
  color: #fff;
  padding: 8px 16px;
  font-size: 1.1em;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0;
  border-radius: 6px 6px 0 0;
}

/* Session header followed by a gapped (border-spacing) table rather than a
   flush list — round the bottom corners too since they're exposed to the
   background instead of butting against another rounded block. */
.section-title.section-title-gapped {
  border-radius: 6px;
}

.session-row {
  background: rgba(255,255,255,0.88);
  border-bottom: 2px solid rgba(10,132,200,0.15);
  padding: 12px 16px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  gap: 24px;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
}

.session-date { font-size: 1.2em; font-weight: bold; color: #064878; min-width: 240px; }
.session-time { font-size: 1.4em; font-weight: bold; color: #0a84c8; }

.price-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.price-table tr { border-bottom: 2px solid rgba(10,132,200,0.1); }
.price-table tr:last-child { border-bottom: none; }
.price-table tr:last-child .price-label  { border-radius: 0 0 0 6px; }
.price-table tr:last-child .price-amount { border-radius: 0 0 6px 0; }
.price-label  { padding: 12px 16px; font-size: 1.2em; font-weight: 600; color: #064878; background: rgba(255,255,255,0.88); }
.price-amount { padding: 12px 16px; font-size: 1.4em; font-weight: bold; color: #0a84c8; text-align: right; background: rgba(255,255,255,0.88); }
.price-subheading { margin-left: 0.75em; font-size: 0.8em; font-weight: 400; color: #4a7a9b; margin-top: 2px; }

/* ── Preview date bar ── */
#preview-bar {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  padding: 6px 12px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #fff;
  user-select: none;
}
#preview-bar button {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
#preview-bar button:hover { background: rgba(255,255,255,0.25); }
#preview-bar button.today-btn { font-weight: 700; }
#preview-date-input {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  padding: 3px 8px;
  cursor: pointer;
  outline: none;
  min-width: 130px;
  text-align: center;
}
#preview-date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

/* ── Empty / Error ── */
.empty {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
  height: 100%;
  color: rgba(255,255,255,0.8);
}

.empty-icon { font-size: 5em; margin-bottom: 16px; }
.empty p { font-size: 1.8em; font-weight: bold; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div id="preview-bar" style="display:none">
  <button id="pb-prev">&#8249;</button>
  <input type="date" id="preview-date-input" />
  <button id="pb-next">&#8250;</button>
  <button class="today-btn" id="pb-today">Today</button>
</div>
<header>
  <span class="rink-name" id="rink-name">Ice Rink</span>
  <span class="date" id="date"></span>
  <span class="clock" id="clock"></span>
</header>
<div id="content"></div>

<script>
var SCREEN_ID = '{{SCREEN_ID}}';
var refreshTimer = null;
var reloadTimer = null;
var PREVIEW_DATE = (typeof URLSearchParams !== 'undefined')
  ? (new URLSearchParams(location.search).get('preview_date') || null)
  : null;

function getNow() {
  return PREVIEW_DATE ? new Date(PREVIEW_DATE + 'T00:00:00') : new Date();
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

function stepDate(dateStr, delta) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

// ── Preview bar ───────────────────────────────────────────────────────────────
var IS_PREVIEW = (typeof URLSearchParams !== 'undefined') && new URLSearchParams(location.search).has('preview');
if (IS_PREVIEW) {
  if (!PREVIEW_DATE) PREVIEW_DATE = todayStr();
  var bar = document.getElementById('preview-bar');
  var dateInput = document.getElementById('preview-date-input');
  bar.style.display = 'flex';
  dateInput.value = PREVIEW_DATE;

  function setPreviewDate(d) {
    PREVIEW_DATE = d;
    dateInput.value = d;
    loadScreen();
  }

  document.getElementById('pb-prev').onclick = function() { setPreviewDate(stepDate(PREVIEW_DATE, -1)); };
  document.getElementById('pb-next').onclick = function() { setPreviewDate(stepDate(PREVIEW_DATE, 1)); };
  document.getElementById('pb-today').onclick = function() { setPreviewDate(todayStr()); };
  dateInput.onchange = function() { if (dateInput.value) setPreviewDate(dateInput.value); };
}

function filterByCalIds(items, calIds) {
  if (!calIds || !calIds.length) return items;
  return items.filter(function(x) { return calIds.indexOf(x.calendar_id) !== -1; });
}

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock').innerHTML = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('date').innerHTML = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}
setInterval(updateClock, 1000);
updateClock();

// ── XHR helper ────────────────────────────────────────────────────────────
function get(url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      try { cb(null, JSON.parse(xhr.responseText)); }
      catch(e) { cb(e); }
    }
  };
  xhr.send();
}

// ── Format helpers ─────────────────────────────────────────────────────────
// Escape data before inserting into innerHTML — titles and team names come
// from external calendar feeds and must never be treated as markup
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(iso) {
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

function fmtDate(iso) {
  var d = new Date(iso);
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}

// ── Render ─────────────────────────────────────────────────────────────────
function buildPriceTable(prices) {
  if (!prices || !prices.length) {
    return '<div style="padding:16px;color:rgba(255,255,255,0.7)">Pricing not configured</div>';
  }
  var html = '';
  for (var j = 0; j < prices.length; j++) {
    var labelCell = esc(prices[j].label);
    if (prices[j].subheading) {
      labelCell += '<div class="price-subheading">' + esc(prices[j].subheading) + '</div>';
    }
    html += '<tr><td class="price-label">' + labelCell + '</td><td class="price-amount">' + esc(prices[j].price) + '</td></tr>';
  }
  return '<table class="price-table">' + html + '</table>';
}

function wrapWithPricing(pageHtml, prices) {
  if (!prices) return pageHtml;
  return '<div class="skate-wrap">' +
    '<div class="skate-sessions">' + pageHtml + '</div>' +
    '<div class="skate-pricing"><div class="section-title">Admission</div>' + buildPriceTable(prices) + '</div>' +
    '</div>';
}

function renderGames(games, calMap, teamMap, prices) {
  teamMap = teamMap || {};
  if (!games || games.length === 0) {
    document.getElementById('content').innerHTML =
      wrapWithPricing('<div class="empty"><div class="empty-icon">&#127944;</div><p>No games scheduled for today</p></div>', prices);
    return;
  }

  // Group by calendar
  var groups = {};
  var groupOrder = [];
  for (var i = 0; i < games.length; i++) {
    var key = games[i].calendar_id ? String(games[i].calendar_id) : '__none__';
    if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
    groups[key].push(games[i]);
  }

  var tbody = '';
  for (var gi = 0; gi < groupOrder.length; gi++) {
    var key = groupOrder[gi];
    var calName = calMap && calMap[key] ? calMap[key] : '';
    tbody +=
      '<tr class="col-header-row">' +
        '<td class="col-cal-name" colspan="2">' + esc(calName) + '</td>' +
        '<td class="col-transparent td-gap"></td>' +
        '<td style="white-space:nowrap">Home</td>' +
        '<td style="width:70px;min-width:70px;text-align:center">LR#</td>' +
        '<td class="col-transparent td-gap"></td>' +
        '<td style="white-space:nowrap">Away</td>' +
        '<td style="width:70px;min-width:70px;text-align:center">LR#</td>' +
      '</tr>';
    var grpGames = groups[key];
    for (var j = 0; j < grpGames.length; j++) {
      var g = grpGames[j];
      var homeInfo = g.home_team ? (teamMap[g.home_team.toLowerCase()] || { label: g.home_team, color: '', textColor: '' }) : { label: 'TBD', color: '', textColor: '' };
      var awayInfo = g.away_team ? (teamMap[g.away_team.toLowerCase()] || { label: g.away_team, color: '', textColor: '' }) : { label: 'TBD', color: '', textColor: '' };
      var homeStyle = homeInfo.color ? 'background:' + homeInfo.color + ';' + (homeInfo.textColor ? 'color:' + homeInfo.textColor + ';' : '') : '';
      var awayStyle = awayInfo.color ? 'background:' + awayInfo.color + ';' + (awayInfo.textColor ? 'color:' + awayInfo.textColor + ';' : '') : '';
      tbody += '<tr class="game-row">' +
        '<td class="td-time">' + fmtTime(g.start_time) + '</td>' +
        '<td class="td-title">' + esc(g.title || '') + '</td>' +
        '<td class="td-gap"></td>' +
        '<td class="td-home"' + (homeStyle ? ' style="' + esc(homeStyle) + '"' : '') + '>' + esc(homeInfo.label) + '</td>' +
        '<td class="td-locker">' + esc(g.home_locker || '') + '</td>' +
        '<td class="td-gap"></td>' +
        '<td class="td-away"' + (awayStyle ? ' style="' + esc(awayStyle) + '"' : '') + '>' + esc(awayInfo.label) + '</td>' +
        '<td class="td-locker">' + esc(g.away_locker || '') + '</td>' +
        '</tr>';
    }
    if (gi < groupOrder.length - 1) {
      tbody += '<tr style="height:0.6em"><td colspan="8" style="padding:0;border:none;background:transparent"></td></tr>';
    }
  }

  document.getElementById('content').innerHTML =
    wrapWithPricing('<table class="game-table"><tbody>' + tbody + '</tbody></table>', prices);
}

function renderSkate(sessions, prices, heading) {
  var sessionHtml = '';
  if (!sessions || sessions.length === 0) {
    sessionHtml = '<div style="padding:16px;color:rgba(255,255,255,0.7)">No upcoming sessions</div>';
  } else {
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      sessionHtml += '<div class="session-row">' +
        '<span class="session-date">' + fmtDate(s.start_time) + '</span>' +
        '<span class="session-time">' + fmtTime(s.start_time) + ' &ndash; ' + fmtTime(s.end_time) + '</span>' +
        '</div>';
    }
  }

  var sessionsBlock = '<div class="section-title">Upcoming Sessions</div>' + sessionHtml;

  document.getElementById('content').innerHTML =
    (heading ? '<div class="skate-banner">' + esc(heading) + '</div>' : '') +
    wrapWithPricing(sessionsBlock, prices);
}

function renderFigureSkating(screen, events, prices) {
  var oMode = screen.overflow_mode || 'none';
  var twoCol = !!screen.two_column;
  var maxPerPage = twoCol ? 12 : 24; // rows per column; 2-col = 24 events/page

  // Filter to today (or from now for flow mode)
  var filtered2 = filterByCalIds(events, screen.calendar_ids);
  var todayEvents = [];
  if (oMode === 'flow' && !PREVIEW_DATE) {
    clearInterval(reloadTimer);
    reloadTimer = setInterval(loadScreen, 300000);
    var realNow = new Date();
    var flowDayEnd = new Date(realNow.getFullYear(), realNow.getMonth(), realNow.getDate() + 1);
    for (var i = 0; i < filtered2.length; i++) {
      var st = new Date(filtered2[i].start_time);
      if (st >= realNow && st < flowDayEnd) todayEvents.push(filtered2[i]);
    }
  } else {
    var refNow = getNow();
    var todayStart = new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate());
    var todayEnd = new Date(todayStart.getTime() + 86400000);
    for (var i = 0; i < filtered2.length; i++) {
      var st = new Date(filtered2[i].start_time);
      if (st >= todayStart && st < todayEnd) todayEvents.push(filtered2[i]);
    }
  }
  todayEvents.sort(function(a, b) { return new Date(a.start_time) - new Date(b.start_time); });

  // Consolidate rows: group events sharing the same start minute, show time once
  var rows = [];
  var timeMap = {};
  for (var i = 0; i < todayEvents.length; i++) {
    var ev = todayEvents[i];
    var d = new Date(ev.start_time);
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '-' + d.getHours() + '-' + d.getMinutes();
    if (!timeMap[key]) {
      timeMap[key] = { timeStr: fmtTime(ev.start_time), titles: [] };
      rows.push(timeMap[key]);
    }
    timeMap[key].titles.push(ev.raw_title || ev.title || '');
  }
  function titlesCell(titles) {
    return titles.map(function(t) { return esc(t); }).join('<br>');
  }

  function buildColTable(colRows) {
    if (!colRows.length) return '';
    var t = '<table class="game-table"><tbody>';
    for (var i = 0; i < colRows.length; i++) {
      t += '<tr class="event-row">' +
        '<td class="td-time" style="white-space:nowrap">' + colRows[i].timeStr + '</td>' +
        '<td style="padding:0.4em 0.6em;font-size:1em;">' + titlesCell(colRows[i].titles) + '</td>' +
        '</tr>';
    }
    t += '</tbody></table>';
    return t;
  }

  function buildPage(pageRows) {
    var header = '<div class="section-title section-title-gapped">Upcoming Sessions</div>';
    if (!pageRows.length) return header + '<div class="empty"><p>No events scheduled.</p></div>';
    if (!twoCol) {
      var t = '<table class="game-table"><tbody>';
      for (var i = 0; i < pageRows.length; i++) {
        t += '<tr class="event-row">' +
          '<td class="td-time">' + pageRows[i].timeStr + '</td>' +
          '<td style="padding:0.4em 0.6em;font-size:1em;">' + titlesCell(pageRows[i].titles) + '</td>' +
          '</tr>';
      }
      t += '</tbody></table>';
      return header + t;
    } else {
      var half = Math.ceil(pageRows.length / 2);
      var col1 = pageRows.slice(0, half);
      var col2 = pageRows.slice(half);
      return header + '<div style="display:flex;gap:24px;height:100%">' +
        '<div style="flex:1;overflow:hidden">' + buildColTable(col1) + '</div>' +
        '<div style="flex:1;overflow:hidden">' + buildColTable(col2) + '</div>' +
        '</div>';
    }
  }

  function buildPriceTable() {
    if (!prices || !prices.length) {
      return '<div style="padding:16px;color:rgba(255,255,255,0.7)">Pricing not configured</div>';
    }
    var html = '';
    for (var j = 0; j < prices.length; j++) {
      var labelCell = esc(prices[j].label);
      if (prices[j].subheading) {
        labelCell += '<div class="price-subheading">' + esc(prices[j].subheading) + '</div>';
      }
      html += '<tr><td class="price-label">' + labelCell + '</td><td class="price-amount">' + esc(prices[j].price) + '</td></tr>';
    }
    return '<table class="price-table">' + html + '</table>';
  }

  function wrapWithPricing(pageHtml) {
    if (!prices) return pageHtml;
    return '<div class="skate-wrap">' +
      '<div class="skate-sessions">' + pageHtml + '</div>' +
      '<div class="skate-pricing"><div class="section-title">Admission</div>' + buildPriceTable() + '</div>' +
      '</div>';
  }

  var content = document.getElementById('content');
  var bannerHtml = screen.name ? '<div class="skate-banner" style="background:#62B0D0">' + esc(screen.name) + '</div>' : '';

  if (oMode === 'rotate' && rows.length > maxPerPage) {
    // Split into pages, rotate on interval
    var pages = [];
    for (var i = 0; i < rows.length; i += maxPerPage) {
      pages.push(rows.slice(i, i + maxPerPage));
    }
    var pageHtmls = [];
    for (var i = 0; i < pages.length; i++) pageHtmls.push(wrapWithPricing(buildPage(pages[i])));

    content.innerHTML = bannerHtml + pageHtmls[0];
    fitTable();
    var pageIdx = 0;
    refreshTimer = setInterval(function() {
      pageIdx = (pageIdx + 1) % pageHtmls.length;
      content.innerHTML = bannerHtml + pageHtmls[pageIdx];
      fitTable();
    }, (screen.rotate_interval || 30) * 1000);
  } else {
    // No rotation — show first maxPerPage rows
    content.innerHTML = bannerHtml + (rows.length
      ? wrapWithPricing(buildPage(rows.slice(0, maxPerPage)))
      : wrapWithPricing('<div class="empty"><p>No events scheduled for today.</p></div>'));
    fitTable();
  }
}

// ── Auto-fit table font size ──────────────────────────────────────────────
function fitTable() {
  var content = document.getElementById('content');
  var tables = content ? content.querySelectorAll('.game-table') : null;
  if (!tables || !tables.length) return;
  function setSize(size) {
    for (var i = 0; i < tables.length; i++) tables[i].style.fontSize = size + 'em';
  }
  function overflowing() {
    for (var i = 0; i < tables.length; i++) {
      if (tables[i].scrollWidth > tables[i].clientWidth || tables[i].scrollHeight > content.clientHeight) return true;
    }
    return false;
  }
  var size = 2;
  setSize(size);
  while (overflowing() && size > 0.5) {
    size = Math.round((size - 0.05) * 100) / 100;
    setSize(size);
  }
}

// ── Load data ──────────────────────────────────────────────────────────────
function loadScreen() {
  if (reloadTimer) { clearInterval(reloadTimer); }
  reloadTimer = setInterval(loadScreen, 60000);
  get('/api/screens', function(err, screens) {
    if (err || !screens) return;
    var screen = null;
    for (var i = 0; i < screens.length; i++) {
      if (String(screens[i].id) === String(SCREEN_ID)) { screen = screens[i]; break; }
    }
    if (!screen) return;

    // Background
    var bgEl = document.getElementById('bg');
    if (screen.bg_color) bgEl.style.backgroundColor = screen.bg_color;
    if (screen.bg_filename) {
      bgEl.style.backgroundImage = 'url(/uploads/' + screen.bg_filename + ')';
    }
    bgEl.style.opacity = (screen.bg_opacity != null ? screen.bg_opacity : 100) / 100;

    var dtype = screen.display_type;

    if (dtype === 'games') {
      get('/api/games', function(err2, games) {
        if (err2) return;
        var now = getNow();
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var todayEnd = new Date(todayStart.getTime() + 86400000);
        var filtered = [];
        for (var i = 0; i < games.length; i++) {
          var s = new Date(games[i].start_time);
          if (!games[i].is_skate && s >= todayStart && s < todayEnd) filtered.push(games[i]);
        }
        filtered = filterByCalIds(filtered, screen.calendar_ids);
        get('/api/calendars', function(err3, calendars) {
          var calMap = {};
          if (calendars) {
            for (var i = 0; i < calendars.length; i++) {
              calMap[String(calendars[i].id)] = calendars[i].name;
            }
          }
          get('/api/leagues', function(err4, leagues) {
            var teamMap = {};
            if (leagues) {
              for (var i = 0; i < leagues.length; i++) {
                var teams = leagues[i].teams || [];
                for (var j = 0; j < teams.length; j++) {
                  var t = teams[j];
                  teamMap[t.name.toLowerCase()] = {
                    label: t.display_name || t.name,
                    color: t.color || '',
                    textColor: t.text_color || '',
                  };
                }
              }
            }
            if (screen.show_pricing) {
              get('/api/skate-prices', function(err5, prices) {
                var selectedIds = screen.pricing_ids || [];
                var filteredPrices = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
                renderGames(filtered, calMap, teamMap, filteredPrices);
                fitTable();
              });
            } else {
              renderGames(filtered, calMap, teamMap);
              fitTable();
            }
          });
        });
      });

    } else if (dtype === 'skate') {
      // Sessions come from the skate-sessions endpoint (Public Skates calendars),
      // narrowed to this screen's selected calendars. ?from= keeps the preview
      // date bar working and keeps in-progress sessions visible until they end.
      var skateNow = getNow();
      get('/api/skate-sessions?from=' + encodeURIComponent(skateNow.toISOString()), function(err2, sessions) {
        function finishSkate(prices) {
          var daysAhead = screen.days_ahead != null ? screen.days_ahead : 14;
          var cutoff = new Date(skateNow.getTime() + daysAhead * 86400000);
          var list = [];
          if (sessions) {
            for (var i = 0; i < sessions.length; i++) {
              var st = new Date(sessions[i].start_time);
              if (st < cutoff) list.push(sessions[i]);
            }
          }
          list = filterByCalIds(list, screen.calendar_ids);
          renderSkate(list, prices, screen.name);
        }
        if (screen.show_pricing) {
          get('/api/skate-prices', function(err3, prices) {
            var selectedIds = screen.pricing_ids || [];
            var filteredPrices = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
            finishSkate(filteredPrices);
          });
        } else {
          finishSkate(null);
        }
      });

    } else if (dtype === 'webpage') {
      if (screen.webpage_url) {
        var wpWidth = screen.webpage_width || 100;
        var wpZoom = (screen.webpage_zoom || 100) / 100;
        var wpRefresh = screen.webpage_refresh || 0;
        var iframeId = 'webpage-frame';
        document.getElementById('content').innerHTML =
          '<div style="width:100%;height:100%;display:flex;justify-content:center;overflow:hidden;">' +
          '<iframe id="' + iframeId + '" src="' + esc(screen.webpage_url) + '" style="width:' + wpWidth + '%;height:' + Math.round(100 / wpZoom) + '%;border:none;flex-shrink:0;transform:scale(' + wpZoom + ');transform-origin:top center;" allowfullscreen></iframe>' +
          '</div>';
        if (wpRefresh > 0) {
          setTimeout(function reloadFrame() {
            var f = document.getElementById(iframeId);
            if (f) f.src = f.src;
            setTimeout(reloadFrame, wpRefresh * 60000);
          }, wpRefresh * 60000);
        }
      } else {
        document.getElementById('content').innerHTML =
          '<div class="empty"><p>No webpage URL configured.</p></div>';
      }

    } else if (dtype === 'rink_events') {
      get('/api/rink-events', function(err2, events) {
        if (err2 || !events) return;
        var now = getNow();
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var todayEnd = new Date(todayStart.getTime() + 86400000);
        var filtered2 = filterByCalIds(events, screen.calendar_ids);
        var todayEvents = [];
        for (var i = 0; i < filtered2.length; i++) {
          var s = new Date(filtered2[i].start_time);
          if (s >= todayStart && s < todayEnd) todayEvents.push(filtered2[i]);
        }
        todayEvents.sort(function(a, b) { return new Date(a.start_time) - new Date(b.start_time); });
        var html = '';
        if (todayEvents.length === 0) {
          html = '<div class="empty"><p>No events scheduled for today.</p></div>';
        } else {
          html = '<table class="game-table"><tbody>';
          html += '<tr class="col-header-row"><td class="col-cal-name" colspan="2">Rink Events</td></tr>';
          for (var i = 0; i < todayEvents.length; i++) {
            var ev = todayEvents[i];
            var timeStr = fmtTime(ev.start_time);
            var title = ev.raw_title || ev.title || '';
            html += '<tr class="event-row">' +
              '<td class="td-time">' + timeStr + '</td>' +
              '<td style="padding:0.4em 0.6em;font-size:1em;">' + esc(title) + '</td>' +
              '</tr>';
          }
          html += '</tbody></table>';
        }
        function finishRinkEvents(prices) {
          document.getElementById('content').innerHTML = wrapWithPricing(html, prices);
          fitTable();
        }
        if (screen.show_pricing) {
          get('/api/skate-prices', function(err3, prices) {
            var selectedIds = screen.pricing_ids || [];
            var filteredPrices = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
            finishRinkEvents(filteredPrices);
          });
        } else {
          finishRinkEvents(null);
        }
      });

    } else if (dtype === 'figure_skating') {
      get('/api/figure-skating', function(err2, events) {
        if (err2 || !events) return;
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }

        if (screen.show_pricing) {
          get('/api/skate-prices', function(err3, prices) {
            var selectedIds = screen.pricing_ids || [];
            var filtered = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
            renderFigureSkating(screen, events, filtered);
          });
        } else {
          renderFigureSkating(screen, events, null);
        }
      });

    } else if (dtype === 'custom') {
      get('/api/games', function(err2, games) {
        get('/api/rink-events', function(err3, rinkEvents) {
          get('/api/figure-skating', function(err4, figEvents) {
            get('/api/calendars', function(err5, calendars) {
              get('/api/leagues', function(err6, leagues) {
                var now = getNow();
                var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                var todayEnd = new Date(todayStart.getTime() + 86400000);

                var calMap = {};
                if (calendars) {
                  for (var i = 0; i < calendars.length; i++) {
                    calMap[String(calendars[i].id)] = calendars[i].name;
                  }
                }

                var teamMap = {};
                if (leagues) {
                  for (var i = 0; i < leagues.length; i++) {
                    var teams = leagues[i].teams || [];
                    for (var j = 0; j < teams.length; j++) {
                      var t = teams[j];
                      teamMap[t.name.toLowerCase()] = {
                        label: t.display_name || t.name,
                        color: t.color || '',
                        textColor: t.text_color || '',
                      };
                    }
                  }
                }

                var items = [];

                if (games) {
                  var fg = filterByCalIds(games, screen.calendar_ids);
                  for (var i = 0; i < fg.length; i++) {
                    var g = fg[i];
                    var st = new Date(g.start_time);
                    if (st >= todayStart && st < todayEnd) {
                      items.push({ start_time: g.start_time, kind: g.is_skate ? 'skate' : 'game',
                        title: g.title || '', calendar_id: g.calendar_id,
                        home_team: g.home_team, away_team: g.away_team,
                        home_locker: g.home_locker, away_locker: g.away_locker });
                    }
                  }
                }
                if (rinkEvents) {
                  var fr = filterByCalIds(rinkEvents, screen.calendar_ids);
                  for (var i = 0; i < fr.length; i++) {
                    var ev = fr[i];
                    var st = new Date(ev.start_time);
                    if (st >= todayStart && st < todayEnd) {
                      items.push({ start_time: ev.start_time, kind: 'event',
                        title: ev.raw_title || ev.title || '', calendar_id: ev.calendar_id });
                    }
                  }
                }
                if (figEvents) {
                  var ff = filterByCalIds(figEvents, screen.calendar_ids);
                  for (var i = 0; i < ff.length; i++) {
                    var ev = ff[i];
                    var st = new Date(ev.start_time);
                    if (st >= todayStart && st < todayEnd) {
                      items.push({ start_time: ev.start_time, kind: 'figure',
                        title: ev.raw_title || ev.title || '', calendar_id: ev.calendar_id });
                    }
                  }
                }

                items.sort(function(a, b) { return new Date(a.start_time) - new Date(b.start_time); });

                function finishCustom(customHtml, prices) {
                  document.getElementById('content').innerHTML = wrapWithPricing(customHtml, prices);
                  fitTable();
                }

                if (items.length === 0) {
                  var emptyHtml = '<div class="empty"><div class="empty-icon">&#128197;</div><p>No events scheduled for today</p></div>';
                  if (screen.show_pricing) {
                    get('/api/skate-prices', function(err7, prices) {
                      var selectedIds = screen.pricing_ids || [];
                      var filteredPrices = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
                      finishCustom(emptyHtml, filteredPrices);
                    });
                  } else {
                    finishCustom(emptyHtml, null);
                  }
                  return;
                }

                var tbody = '';
                for (var i = 0; i < items.length; i++) {
                  var it = items[i];
                  var calName = calMap[String(it.calendar_id)] || '';
                  var timeStr = fmtTime(it.start_time);
                  if (it.kind === 'game') {
                    var homeInfo = it.home_team ? (teamMap[it.home_team.toLowerCase()] || { label: it.home_team, color: '', textColor: '' }) : { label: 'TBD', color: '', textColor: '' };
                    var awayInfo = it.away_team ? (teamMap[it.away_team.toLowerCase()] || { label: it.away_team, color: '', textColor: '' }) : { label: 'TBD', color: '', textColor: '' };
                    var homeStyle = homeInfo.color ? 'background:' + homeInfo.color + ';' + (homeInfo.textColor ? 'color:' + homeInfo.textColor + ';' : '') : '';
                    var awayStyle = awayInfo.color ? 'background:' + awayInfo.color + ';' + (awayInfo.textColor ? 'color:' + awayInfo.textColor + ';' : '') : '';
                    tbody += '<tr class="game-row">' +
                      '<td class="td-time">' + timeStr + '</td>' +
                      '<td class="td-title">' + esc(calName) + '</td>' +
                      '<td class="td-gap"></td>' +
                      '<td class="td-home"' + (homeStyle ? ' style="' + esc(homeStyle) + '"' : '') + '>' + esc(homeInfo.label) + '</td>' +
                      '<td class="td-locker">' + esc(it.home_locker || '') + '</td>' +
                      '<td class="td-gap"></td>' +
                      '<td class="td-away"' + (awayStyle ? ' style="' + esc(awayStyle) + '"' : '') + '>' + esc(awayInfo.label) + '</td>' +
                      '<td class="td-locker">' + esc(it.away_locker || '') + '</td>' +
                      '</tr>';
                  } else {
                    tbody += '<tr class="event-row">' +
                      '<td class="td-time">' + timeStr + '</td>' +
                      '<td style="padding:0.4em 0.6em;font-size:1em;">' +
                        (calName ? '<span style="opacity:0.6;margin-right:0.5em">' + esc(calName) + '</span>' : '') +
                        esc(it.title) +
                      '</td>' +
                      '</tr>';
                  }
                }
                var customHtml = '<table class="game-table"><tbody>' + tbody + '</tbody></table>';
                if (screen.show_pricing) {
                  get('/api/skate-prices', function(err7, prices) {
                    var selectedIds = screen.pricing_ids || [];
                    var filteredPrices = (prices || []).filter(function(p) { return selectedIds.indexOf(p.id) !== -1; });
                    finishCustom(customHtml, filteredPrices);
                  });
                } else {
                  finishCustom(customHtml, null);
                }
              });
            });
          });
        });
      });

    } else if (dtype === 'message') {
      document.getElementById('content').innerHTML =
        '<div class="empty"><p>' + esc(screen.custom_message || 'Welcome!') + '</p></div>';

    } else if (dtype === 'announcement') {
      var annoData = screen.announcement_data;
      var content = document.getElementById('content');
      content.style.position = 'relative';
      content.style.padding = '0';
      if (!annoData || !annoData.elements || !annoData.elements.length) {
        content.innerHTML = '<div class="empty"><p>No announcement content.</p></div>';
        return;
      }
      var annoHtml = '';
      for (var ai = 0; ai < annoData.elements.length; ai++) {
        var ae = annoData.elements[ai];
        if (ae.type === 'text') {
          annoHtml += '<div style="' +
            'position:absolute;left:' + Number(ae.x) + '%;top:' + Number(ae.y) + '%;' +
            'transform:translate(-50%,-50%);' +
            'width:max-content;' +
            'color:' + esc(ae.color || '#fff') + ';' +
            'font-family:' + esc(ae.font || 'Arial') + ',sans-serif;' +
            'font-size:' + ((ae.size || 48) / 19.2).toFixed(3) + 'vw;' +
            'font-weight:' + (ae.bold ? 'bold' : 'normal') + ';' +
            'text-align:' + esc(ae.align || 'left') + ';' +
            'white-space:pre;line-height:1.2;pointer-events:none;' +
            '">' + esc(ae.text || '') + '</div>';
        } else if (ae.type === 'image') {
          annoHtml += '<img src="/uploads/' + esc(ae.filename) + '" style="' +
            'position:absolute;left:' + Number(ae.x) + '%;top:' + Number(ae.y) + '%;' +
            'width:' + (Number(ae.width) || 25) + '%;' +
            'transform:translate(-50%,-50%);pointer-events:none;" alt="" />';
        }
      }
      content.innerHTML = annoHtml;
    }
  });
}

// ── Settings (rink name / logo) ───────────────────────────────────────────────
get('/api/settings', function(err, s) {
  if (err || !s) return;
  var el = document.getElementById('rink-name');
  if (s.logo_filename) {
    el.innerHTML = '<img class="rink-logo" src="/uploads/' + esc(s.logo_filename) + '" alt="' + esc(s.rink_name || 'Rink') + '">';
  } else if (s.rink_name) {
    el.innerHTML = esc(s.rink_name);
  }
});

// ── WebSocket (best-effort) ────────────────────────────────────────────────
function connectWS() {
  try {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + location.host + '?screenId=' + SCREEN_ID);
    ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'ping') ws.send('{"type":"pong"}');
        if (msg.type === 'reload' || msg.type === 'refresh_data') loadScreen();
      } catch(x) {}
    };
    ws.onclose = function() { setTimeout(connectWS, 3000); };
  } catch(x) {}
}
connectWS();

// ── Auto-refresh fallback (interval managed dynamically inside loadScreen) ─

// ── Initial load ───────────────────────────────────────────────────────────
loadScreen();
</script>
